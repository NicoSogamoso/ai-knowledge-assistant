[project]
name = "ai-knowledge-assistant"
version = "0.1.0"
description = "Bootstrap API - AI Knowledge Assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "httpx",
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
